
name: Track SEO rankings

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run rank tracker
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python track_rankings.py

      - name: Commit updated rankings
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/rankings.csv
          git diff --cached --quiet || git commit -m "Update rankings $(date -u +%F)"
          git push
